[package]
name = "stickers_whatsapp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
webp = "0.3.1"
webp-animation = "0.10.0"
qrcode = { version = "0.14.1", default-features = false }
tiny_http = "0.12.0"
local-ip-address = "0.6.13"
serde_json = "1.0.154"
zip = "9.5.1"

[[bin]]
name = "stickerpack"
path = "src/main.rs"

